<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Prateleira de HQs</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='sepia')document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root,[data-theme=dark]{--bg:#1e2238;--card:#2a3050;--ink:#0d0e16;--txt:#eceaf4;--mut:#9a9cb8;--acc:#ffd23f;--on:#0d0e16;--dots:rgba(255,210,63,.12);--rd:#0d0e16;color-scheme:dark}
[data-theme=light]{--bg:#eceef5;--card:#ffffff;--ink:#1b1d2b;--txt:#1b1d2b;--mut:#585c78;--acc:#ffc400;--on:#1b1d2b;--dots:rgba(27,29,43,.07);--rd:#dde0ea;color-scheme:light}
[data-theme=sepia]{--bg:#eadcbf;--card:#f6ebd3;--ink:#3a2a1a;--txt:#3a2a1a;--mut:#765f42;--acc:#c2691f;--on:#fff8ea;--dots:rgba(58,42,26,.09);--rd:#dfcba3;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background-color:var(--bg);border-bottom:3px solid var(--ink);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.4px);background-size:9px 9px}
h1{font:400 32px Bangers,Impact,sans-serif;letter-spacing:1.5px;margin:0 auto 0 0;color:var(--acc);text-shadow:2px 2px 0 var(--ink)}
input,button{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:8px 12px}
input{min-width:200px}
button{cursor:pointer;font-weight:600}
button:hover,button:focus-visible{background:var(--acc);color:var(--on);outline:none}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{background:var(--card);color:var(--txt)}
[hidden]{display:none!important}
#msg{padding:14px 20px;color:var(--mut);min-height:48px}
#msg:empty{min-height:0;padding:6px 20px}

/* Categorias */
#cats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px 0}
#cats:empty{display:none}
.chip{padding:5px 14px;border-radius:99px;font-size:13px}
.chip[aria-pressed=true]{background:var(--acc);color:var(--on)}
.chip.sm{font-weight:400;font-size:12px;padding:4px 10px;border-style:dashed}
.sp{flex:1}

/* Prateleira */
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;padding:12px 20px 40px}
.card{position:relative}
.open{display:block;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:400;cursor:pointer}
.open:hover,.open:focus-visible{background:none;color:inherit}
.cov{position:relative;aspect-ratio:2/3;background:var(--card);border:3px solid var(--ink);border-radius:3px;overflow:hidden;transition:transform .15s,box-shadow .15s;display:grid;place-items:center}
.open:hover .cov,.open:focus-visible .cov{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--acc)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{font:400 34px Bangers,Impact,sans-serif;color:var(--mut);letter-spacing:2px}
.bar{position:absolute;left:0;bottom:0;height:5px;background:var(--acc);z-index:1}
.nm{margin-top:8px;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sz{color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px;margin-top:6px}
.act{flex:1;padding:4px 6px;font-size:12px;border-radius:5px}
.act[aria-pressed=true]{background:var(--acc);color:var(--on)}
.selmode .cov::before{content:'';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);background:rgba(0,0,0,.35);z-index:2}
.card[data-sel] .cov{box-shadow:0 0 0 4px var(--acc)}
.card[data-sel] .cov::after{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:14px;z-index:3}
#sb{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bg);border-top:3px solid var(--ink)}
#sb.on{display:flex}
#sc{margin-right:auto;font-weight:600}
.selmode #shelf{padding-bottom:120px}

/* Leitor */
#rd{position:fixed;inset:0;background:var(--rd);display:none;z-index:10;flex-direction:column}
#rd.on{display:flex}
#top{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bg);border-bottom:2px solid var(--ink)}
#tt{flex:1;min-width:80px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0}
#pg{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center}
#pg img{flex:none;display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#pg img:not([src]){visibility:hidden}
#pg #im2{display:none}
#pg.two img{width:50%}
#pg.two #im2{display:block}
#pg.two #im{object-position:right center}
#pg.two #im2{object-position:left center}
#pg.two.rtl{flex-direction:row-reverse}
#pg.two.rtl #im{object-position:left center}
#pg.two.rtl #im2{object-position:right center}
#pg.w{align-items:flex-start}
#pg.w img{height:auto;object-fit:initial}
.z{position:absolute;top:0;bottom:0;width:33%;z-index:2;cursor:pointer}
#zl{left:0}#zr{right:0}
#ld{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--acc);pointer-events:none;z-index:3;padding:0 16px;text-shadow:0 0 6px #000,0 0 6px #000}

/* Janelas */
#fp,#cp{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;place-items:center}
#fp.on,#cp.on{display:grid}
#fb,#cb{background:var(--bg);border:3px solid var(--ink);border-radius:6px;width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column;padding:16px;gap:10px}
#fl,#cl{overflow:auto;flex:1;min-height:120px;display:flex;flex-direction:column;gap:4px}
#fl{min-height:200px}
#fl button,#cl button{text-align:left}
#fc{color:var(--mut);font-size:13px}
.fa{display:flex;gap:8px;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Prateleira de HQs</h1>
  <input id="q" type="search" placeholder="Buscar quadrinho" aria-label="Buscar quadrinho">
  <button id="selbtn" hidden>Selecionar</button>
  <button id="pick" hidden>Escolher pasta</button>
  <button id="reload" hidden>Atualizar lista</button>
  <button class="themebtn" title="Alternar tema">Tema</button>
  <button id="login">Entrar com Google</button>
  <button id="logout" hidden title="Revoga o acesso ao Drive">Sair</button>
</header>
<nav id="cats" aria-label="Categorias"></nav>
<div id="msg">Entre com sua conta Google para ver os quadrinhos do seu Drive.</div>
<main id="shelf"></main>

<div id="sb">
  <span id="sc"></span>
  <button id="sall">Selecionar todos</button>
  <button id="snone">Limpar</button>
  <button id="slater">Vou ler</button>
  <button id="scat">Categoria…</button>
  <button id="srem">Tirar daqui</button>
  <button id="sdone">Concluir</button>
</div>

<div id="fp"><div id="fb">
  <strong>Escolha a pasta dos quadrinhos</strong>
  <input id="fi" placeholder="Ou cole aqui o link ou o ID da pasta">
  <div id="fc"></div><div id="fl"></div>
  <div class="fa"><button id="fcancel">Cancelar</button><button id="fuse">Usar esta pasta</button></div>
</div></div>

<div id="cp"><div id="cb">
  <strong id="cpt">Categorias</strong>
  <div id="cl"></div>
  <input id="cn" placeholder="Nova categoria (ex.: Asterix)" maxlength="40">
  <div class="fa"><button id="cnew">Criar e adicionar</button><button id="cclose">Fechar</button></div>
</div></div>

<div id="rd" role="dialog" aria-label="Leitor">
  <div id="top">
    <button id="x">Fechar</button><span id="tt"></span><span id="ct"></span>
    <button id="dbl" title="Mostrar duas páginas lado a lado (tecla D)">Página dupla: desligada</button>
    <button id="fit" title="Alternar ajuste">Ajuste: altura</button>
    <button id="dir" title="Sentido de leitura">Esq → Dir</button>
    <button class="themebtn" title="Alternar tema">Tema</button>
    <button id="fs">Tela cheia</button>
  </div>
  <div id="stage">
    <div id="pg"><img id="im" alt=""><img id="im2" alt=""></div>
    <div class="z" id="zl"></div><div class="z" id="zr"></div>
    <div id="ld"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.34/dist/zip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const CLIENT_ID = '8937921951-30cpfpnngt9iioogr153vis0c0d42f6i.apps.googleusercontent.com';
const FOLDER_ID = ''; // opcional: pasta padrão. Você também pode escolher pelo botão "Escolher pasta".
/* ======================== */

const $ = s => document.querySelector(s);
const API = 'https://www.googleapis.com/drive/v3/';
const IMG = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const ext = n => (n.split('.').pop() || '').toLowerCase();
const mime = n => 'image/' + ({jpg: 'jpeg'}[ext(n)] || ext(n));
const mb = n => (n / 1048576).toFixed(n > 1e8 ? 0 : 1) + ' MB';
const ls = {get: k => { try { return localStorage.getItem(k) } catch { return null } },
            set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }};
const jget = (k, d) => { try { return JSON.parse(ls.get(k)) ?? d } catch { return d } };
const mk = o => Object.assign(Object.create(null), o);

let files = [], tok = null, exp = 0, tc, folder = ls.get('folder') || FOLDER_ID, stack = [];
let view = ls.get('view') || 'all', selMode = false, sel = new Set();
let cats = mk(jget('cats', {})), later = new Set(jget('later', []));
const saveCats = () => ls.set('cats', JSON.stringify(cats));
const saveLater = () => ls.set('later', JSON.stringify([...later]));
zip.configure({useWebWorkers: false});
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- Tema ---------- */
const THEMES = [['dark', 'Escuro'], ['light', 'Claro'], ['sepia', 'Sépia']];
function setTheme(t) {
  if (!THEMES.some(x => x[0] === t)) t = 'dark';
  document.documentElement.dataset.theme = t; ls.set('theme', t);
  const name = THEMES.find(x => x[0] === t)[1];
  document.querySelectorAll('.themebtn').forEach(b => b.textContent = 'Tema: ' + name);
}
document.querySelectorAll('.themebtn').forEach(b => b.onclick = () => {
  const i = THEMES.findIndex(x => x[0] === document.documentElement.dataset.theme);
  setTheme(THEMES[(i + 1) % THEMES.length][0]);
});
setTheme(ls.get('theme') || 'dark');

/* ---------- Capas guardadas (IndexedDB) ---------- */
const idb = (() => {
  let db;
  const open = () => db || (db = new Promise((ok, no) => {
    const r = indexedDB.open('hq', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('covers');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const tx = (m, fn) => open().then(d => new Promise((ok, no) => {
    const t = d.transaction('covers', m), q = fn(t.objectStore('covers'));
    t.oncomplete = () => ok(q.result); t.onerror = () => no(t.error);
  }));
  return {get: k => tx('readonly', s => s.get(k)).catch(() => null),
          set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {})};
})();

/* ---------- Login ---------- */
function auth() {
  return new Promise((ok, no) => {
    if (tok && Date.now() < exp - 60000) return ok(tok);
    tc.callback = r => {
      if (r.error) return no(new Error(r.error));
      tok = r.access_token; exp = Date.now() + r.expires_in * 1000; ok(tok);
    };
    tc.requestAccessToken({prompt: ''});
  });
}
window.addEventListener('load', () => {
  const t = setInterval(() => {
    if (!window.google?.accounts) return;
    clearInterval(t);
    tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly', callback: () => {}});
  }, 100);
});
const msg = t => $('#msg').textContent = t;
function ui(on) {
  ['#reload', '#pick', '#selbtn', '#logout'].forEach(s => $(s).hidden = !on);
  $('#login').hidden = on;
}
$('#login').onclick = async () => {
  if (!tc) return msg('Biblioteca do Google ainda carregando. Tente de novo.');
  try { await auth(); ui(true); folder ? load() : $('#pick').click(); }
  catch (e) { msg('Não foi possível entrar: ' + e.message + '. Confira o Client ID e as origens autorizadas.'); }
};
$('#logout').onclick = () => {
  if (tok) google.accounts.oauth2.revoke(tok, () => {});
  tok = null; exp = 0; files = []; wait = [];
  setSel(false); $('#shelf').innerHTML = ''; $('#cats').textContent = ''; ui(false);
  msg('Você saiu e o acesso ao Drive foi revogado. Entre de novo quando quiser.');
};
$('#reload').onclick = () => load();

/* ---------- Drive ---------- */
async function api(path) {
  const r = await fetch(API + path, {headers: {Authorization: 'Bearer ' + await auth()}});
  if (!r.ok) throw new Error('Drive respondeu ' + r.status);
  return r.json();
}
async function listAll(q) {
  let out = [], pt = '';
  do {
    const r = await api(`files?pageSize=1000&fields=nextPageToken,files(id,name,size,mimeType,thumbnailLink)&q=${encodeURIComponent(q)}${pt ? '&pageToken=' + encodeURIComponent(pt) : ''}`);
    out.push(...r.files); pt = r.nextPageToken;
  } while (pt);
  return out;
}
async function crawl(id) {
  const items = await listAll(`'${id}' in parents and trashed=false`);
  const subs = items.filter(i => i.mimeType === 'application/vnd.google-apps.folder');
  const rest = await Promise.all(subs.map(s => crawl(s.id)));
  return items.filter(i => !subs.includes(i)).concat(...rest);
}
async function rng(id, a, b) {
  const r = await fetch(`${API}files/${id}?alt=media`, {headers: {Authorization: 'Bearer ' + await auth(), Range: `bytes=${a}-${b}`}});
  if (!r.ok) throw new Error('Download falhou (' + r.status + ')');
  return new Uint8Array(await r.arrayBuffer());
}
async function whole(f, quiet) {
  const r = await fetch(`${API}files/${f.id}?alt=media`, {headers: {Authorization: 'Bearer ' + await auth()}});
  if (!r.ok) throw new Error('Download falhou (' + r.status + ')');
  const total = +f.size || 0, chunks = []; let n = 0;
  const rd = r.body.getReader();
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    chunks.push(value); n += value.length;
    if (!quiet) $('#ld').textContent = `Baixando ${mb(n)}${total ? ' de ' + mb(total) : ''}…`;
  }
  const buf = new Uint8Array(n); let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf;
}
async function load() {
  $('#shelf').innerHTML = '';
  if (!folder) return msg('Clique em "Escolher pasta" para selecionar onde estão seus quadrinhos.');
  msg('Procurando quadrinhos…');
  try {
    const all = await crawl(folder);
    files = all.filter(f => /^(cbz|cbr|pdf)$/.test(ext(f.name))).sort((a, b) => nat(a.name, b.name));
    msg(files.length ? '' : 'Nenhum CBZ, CBR ou PDF encontrado.');
    draw();
  } catch (e) { console.error(e); msg('Erro ao listar: ' + e.message); }
}

/* ---------- Escolher pasta ---------- */
const fid = t => (t.match(/[-\w]{20,}/) || [''])[0];
async function browse() {
  const cur = stack[stack.length - 1];
  $('#fc').textContent = stack.map(x => x.name).join(' / ');
  $('#fl').textContent = 'Carregando…';
  try {
    const FQ = "mimeType='application/vnd.google-apps.folder' and trashed=false";
    const d = (await listAll(cur.id === 'shared' ? 'sharedWithMe=true and ' + FQ : `'${cur.id}' in parents and ${FQ}`)).sort((a, b) => nat(a.name, b.name));
    const box = $('#fl'); box.textContent = '';
    const add = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.onclick = fn; box.append(b); };
    if (stack.length > 1) add('↑ Voltar', () => { stack.pop(); browse(); });
    if (stack.length === 1) add('Compartilhados comigo', () => { stack.push({id: 'shared', name: 'Compartilhados comigo'}); browse(); });
    d.forEach(x => add(x.name, () => { stack.push({id: x.id, name: x.name}); browse(); }));
    if (!d.length) box.append('Nenhuma subpasta aqui.');
  } catch (e) { $('#fl').textContent = 'Erro: ' + e.message; }
}
$('#pick').onclick = () => { stack = [{id: 'root', name: 'Meu Drive'}]; $('#fi').value = ''; $('#fp').classList.add('on'); browse(); };
$('#fcancel').onclick = () => $('#fp').classList.remove('on');
$('#fuse').onclick = () => {
  const id = fid($('#fi').value) || stack[stack.length - 1].id;
  if (id === 'root' || id === 'shared') return $('#fc').textContent = 'Entre na pasta dos quadrinhos antes de clicar em "Usar esta pasta".';
  folder = id; ls.set('folder', id); $('#fp').classList.remove('on'); load();
};

/* ---------- Categorias e "Vou ler" ---------- */
function addCat(name) {
  name = (name || '').trim().slice(0, 40); if (!name) return '';
  const hit = Object.keys(cats).find(k => k.toLowerCase() === name.toLowerCase());
  if (hit) return hit;
  cats[name] = []; saveCats(); return name;
}
function toggleLater(ids) {
  const all = ids.every(i => later.has(i));
  ids.forEach(i => all ? later.delete(i) : later.add(i));
  saveLater();
}
function visible() {
  const q = $('#q').value.toLowerCase();
  let list = files.filter(f => f.name.toLowerCase().includes(q));
  if (view === 'later') list = list.filter(f => later.has(f.id));
  else if (view.startsWith('cat:')) { const s = new Set(cats[view.slice(4)] || []); list = list.filter(f => s.has(f.id)); }
  return list;
}
function drawCats() {
  const box = $('#cats'); box.textContent = '';
  if (!files.length) return;
  if (view.startsWith('cat:') && !cats[view.slice(4)]) { view = 'all'; ls.set('view', view); }
  const ids = new Set(files.map(f => f.id));
  const n = arr => arr.filter(i => ids.has(i)).length;
  const btn = (label, fn, cls) => { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; box.append(b); return b; };
  const chip = (label, v, count) => {
    const b = btn(label + ` (${count})`, () => { view = v; ls.set('view', v); draw(); }, 'chip');
    b.setAttribute('aria-pressed', view === v);
  };
  chip('Todos', 'all', files.length);
  chip('Vou ler', 'later', n([...later]));
  Object.keys(cats).sort(nat).forEach(k => chip(k, 'cat:' + k, n(cats[k])));
  btn('+ Categoria', () => { const k = addCat(prompt('Nome da nova categoria:')); if (k) { view = 'cat:' + k; ls.set('view', view); draw(); } }, 'chip sm');
  if (view.startsWith('cat:')) {
    const k = view.slice(4);
    btn('Renomear', () => {
      const nn = (prompt('Novo nome:', k) || '').trim().slice(0, 40);
      if (!nn || nn === k) return;
      if (Object.keys(cats).some(x => x !== k && x.toLowerCase() === nn.toLowerCase())) return alert('Já existe uma categoria com esse nome.');
      cats[nn] = cats[k]; delete cats[k]; saveCats(); view = 'cat:' + nn; ls.set('view', view); draw();
    }, 'chip sm');
    btn('Excluir categoria', () => {
      if (!confirm(`Excluir a categoria "${k}"? Os quadrinhos continuam no Drive.`)) return;
      delete cats[k]; saveCats(); view = 'all'; ls.set('view', view); draw();
    }, 'chip sm');
  }
  box.append(Object.assign(document.createElement('span'), {className: 'sp'}));
  btn('Exportar', exportData, 'chip sm').title = 'Salvar categorias e "Vou ler" num arquivo de backup';
  btn('Importar', () => $('#imp').click(), 'chip sm').title = 'Restaurar um backup';
}
function exportData() {
  const blob = new Blob([JSON.stringify({cats, later: [...later]}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hq-categorias.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const imp = Object.assign(document.createElement('input'), {type: 'file', accept: 'application/json', id: 'imp', hidden: true});
document.body.append(imp);
imp.onchange = () => {
  const f = imp.files[0]; imp.value = ''; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    for (const k of Object.keys(d.cats || {})) if (Array.isArray(d.cats[k]))
      cats[k] = [...new Set([...(cats[k] || []), ...d.cats[k].filter(x => typeof x === 'string')])];
    (Array.isArray(d.later) ? d.later : []).forEach(i => typeof i === 'string' && later.add(i));
    saveCats(); saveLater(); draw();
  }).catch(() => msg('Arquivo de backup inválido.'));
};

/* janela de categorias (um ou vários quadrinhos) */
let cpIds = [];
function catPicker(ids) {
  if (!ids.length) return;
  cpIds = ids; $('#cn').value = '';
  $('#cpt').textContent = ids.length > 1 ? `Categorias para ${ids.length} quadrinhos` : 'Categorias';
  renderCp(); $('#cp').classList.add('on');
}
function renderCp() {
  const box = $('#cl'); box.textContent = '';
  const keys = Object.keys(cats).sort(nat);
  if (!keys.length) box.textContent = 'Nenhuma categoria ainda. Crie a primeira abaixo.';
  keys.forEach(k => {
    const all = cpIds.every(i => cats[k].includes(i)), b = document.createElement('button');
    b.textContent = (all ? '✓ ' : '+ ') + k;
    b.onclick = () => {
      cats[k] = all ? cats[k].filter(i => !cpIds.includes(i)) : [...new Set([...cats[k], ...cpIds])];
      saveCats(); renderCp();
    };
    box.append(b);
  });
}
$('#cnew').onclick = () => {
  const k = addCat($('#cn').value); if (!k) return;
  cats[k] = [...new Set([...cats[k], ...cpIds])]; saveCats(); $('#cn').value = ''; renderCp();
};
$('#cn').onkeydown = e => { if (e.key === 'Enter') $('#cnew').click(); };
$('#cclose').onclick = () => { $('#cp').classList.remove('on'); draw(); };

/* seleção em massa */
function setSel(on) {
  selMode = on; if (!on) sel.clear();
  document.body.classList.toggle('selmode', on); $('#sb').classList.toggle('on', on);
  $('#selbtn').textContent = on ? 'Sair da seleção' : 'Selecionar';
  if (files.length) draw(); else updSb();
}
function updSb() {
  const k = sel.size;
  $('#sc').textContent = k ? `${k} selecionado${k > 1 ? 's' : ''}` : 'Toque nos quadrinhos para selecionar';
  ['#slater', '#scat', '#srem', '#snone'].forEach(s => $(s).disabled = !k);
  $('#srem').hidden = view === 'all';
  $('#srem').textContent = view === 'later' ? 'Tirar de "Vou ler"' : 'Tirar desta categoria';
}
$('#selbtn').onclick = () => setSel(!selMode);
$('#sdone').onclick = () => setSel(false);
$('#sall').onclick = () => { visible().forEach(f => sel.add(f.id)); draw(); };
$('#snone').onclick = () => { sel.clear(); draw(); };
$('#slater').onclick = () => { toggleLater([...sel]); draw(); };
$('#scat').onclick = () => catPicker([...sel]);
$('#srem').onclick = () => {
  if (view === 'later') sel.forEach(i => later.delete(i));
  else if (view.startsWith('cat:')) { const k = view.slice(4); cats[k] = (cats[k] || []).filter(i => !sel.has(i)); }
  saveCats(); saveLater(); sel.clear(); draw();
};

/* ---------- Prateleira ---------- */
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { obs.unobserve(e.target); queue(e.target, true); }
}), {rootMargin: '300px'});
function draw() {
  drawCats(); updSb();
  const sh = $('#shelf'); sh.innerHTML = ''; wait = [];
  const list = visible();
  if (files.length) msg(list.length ? '' : (view === 'all' ? 'Nenhum resultado para a busca.' : 'Nada aqui ainda. Use "Selecionar" ou os botões dos quadrinhos para adicionar.'));
  list.forEach(f => {
    const c = document.createElement('div'); c.className = 'card'; c.f = f;
    if (sel.has(f.id)) c.toggleAttribute('data-sel', true);
    const p = jget('p:' + f.id, null);
    c.innerHTML = `<button class="open"><div class="cov"><span class="ph">${ext(f.name).toUpperCase()}</span>${p ? `<i class="bar" style="width:${Math.round((p.i + 1) / p.n * 100)}%"></i>` : ''}</div>
      <div class="nm"></div><div class="sz">${mb(+f.size)}</div></button>
      <div class="acts"><button class="act" data-a="later"></button><button class="act" data-a="cat">Categorias</button></div>`;
    c.querySelector('.nm').textContent = f.name.replace(/\.[^.]+$/, '');
    const lb = c.querySelector('[data-a=later]');
    const paintLater = () => { const on = later.has(f.id); lb.textContent = on ? '✓ Vou ler' : '+ Vou ler'; lb.setAttribute('aria-pressed', on); };
    paintLater();
    lb.onclick = () => { toggleLater([f.id]); if (view === 'later') draw(); else { paintLater(); drawCats(); } };
    c.querySelector('[data-a=cat]').onclick = () => catPicker([f.id]);
    c.querySelector('.open').onclick = () => {
      if (!selMode) return openBook(f);
      sel.has(f.id) ? sel.delete(f.id) : sel.add(f.id);
      c.toggleAttribute('data-sel', sel.has(f.id)); updSb();
    };
    sh.append(c); obs.observe(c); queue(c);
  });
}
$('#q').oninput = draw;

/* capas: carregam sozinhas, as visíveis primeiro; ficam guardadas */
function showCover(c, src, onfail, onok) {
  const cv = c.querySelector('.cov'); cv.querySelector('img')?.remove();
  const img = new Image(); img.alt = ''; img.referrerPolicy = 'no-referrer';
  img.onload = () => { cv.querySelector('.ph')?.remove(); onok?.(); };
  img.onerror = () => { img.remove(); onfail?.(); };
  img.src = src; cv.prepend(img);
}
let busy = 0, wait = [], failed = new Set(), heavyLock = Promise.resolve();
const heavy = fn => { const p = heavyLock.then(fn); heavyLock = p.catch(() => {}); return p; }; // downloads inteiros, um por vez
function queue(c, front) {
  if (c.q === 'run' || c.q === 'done') return;
  if (c.q === 'wait') { if (front) { wait = wait.filter(x => x !== c); wait.unshift(c); } return; }
  c.q = 'wait'; front ? wait.unshift(c) : wait.push(c); pump();
}
function pump() {
  if ($('#rd').classList.contains('on')) return; // pausa enquanto você lê
  while (busy < 2 && wait.length) {
    const c = wait.shift(); if (!c.isConnected) continue;
    c.q = 'run'; busy++;
    coverFor(c, c.f).catch(e => { failed.add(c.f.id); console.warn('Capa falhou:', c.f.name, e); })
      .finally(() => { c.q = 'done'; busy--; pump(); });
  }
}
async function coverFor(c, f) {
  const cached = (await idb.get('c:' + f.id)) || ls.get('c:' + f.id);
  if (cached) return showCover(c, cached);
  if (failed.has(f.id)) return;
  if (f.thumbnailLink) {
    const ok = await new Promise(res => {
      setTimeout(() => res(false), 15000);
      showCover(c, f.thumbnailLink.replace(/=s\d+$/, '=s400'), () => res(false), () => res(true));
    });
    if (ok) return;
  }
  const b = await makeBook(f, true), u = await b.get(0);
  try { const d = await thumb(u); idb.set('c:' + f.id, d); if (c.isConnected) showCover(c, d); }
  finally { URL.revokeObjectURL(u); }
}
async function thumb(url) {
  const img = new Image(); img.src = url; await img.decode();
  const s = 260 / img.width, cv = document.createElement('canvas');
  cv.width = 260; cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', .72);
}

/* ---------- Formatos ---------- */
class DR extends zip.Reader {
  constructor(id, size) { super(); this.id = id; this.size = size; }
  async readUint8Array(o, l) { return rng(this.id, o, Math.min(o + l, this.size) - 1); }
}
async function zipBook(reader) {
  const es = (await new zip.ZipReader(reader).getEntries())
    .filter(e => !e.directory && IMG.test(e.filename) && !/__MACOSX/.test(e.filename))
    .sort((a, b) => nat(a.filename, b.filename));
  return {n: es.length, get: async i => URL.createObjectURL(await es[i].getData(new zip.BlobWriter(mime(es[i].filename))))};
}
async function rarBook(data) {
  const base = 'https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/';
  const {createExtractorFromData} = await import(base + '+esm');
  const wasmBinary = await (await fetch(base + 'esm/js/unrar.wasm')).arrayBuffer();
  const ex = await createExtractorFromData({data, wasmBinary});
  const names = [...ex.getFileList().fileHeaders].filter(h => !h.flags.directory && IMG.test(h.name)).map(h => h.name).sort(nat);
  return {n: names.length, get: async i => {
    const fl = [...ex.extract({files: [names[i]]}).files][0];
    // na v2 'extraction' já é o Uint8Array; versões antigas usavam extraction.data
    const bytes = fl && (fl.extraction instanceof Uint8Array ? fl.extraction : fl.extraction?.data);
    if (!bytes || !bytes.length) throw new Error('não foi possível extrair a página do CBR');
    return URL.createObjectURL(new Blob([bytes], {type: mime(names[i])}));
  }};
}
function pdfPages(doc) {
  return {n: doc.numPages, get: async i => {
    const p = await doc.getPage(i + 1), v0 = p.getViewport({scale: 1});
    const v = p.getViewport({scale: Math.min(3, 1800 / Math.max(v0.width, v0.height))});
    const cv = document.createElement('canvas'); cv.width = v.width; cv.height = v.height;
    await p.render({canvasContext: cv.getContext('2d'), viewport: v}).promise;
    return new Promise(ok => cv.toBlob(b => ok(URL.createObjectURL(b)), 'image/jpeg', .9));
  }};
}
// isEvalSupported:false = mitigação da falha CVE-2024-4367 do pdf.js 3.x (PDF malicioso executando script)
async function pdfBook(f) {
  const size = +f.size, init = await rng(f.id, 0, Math.min(size, 65536) - 1);
  const t = new pdfjsLib.PDFDataRangeTransport(size, init);
  t.requestDataRange = (b, e) => rng(f.id, b, Math.min(e, size) - 1).then(d => t.onDataRange(b, d));
  const doc = await pdfjsLib.getDocument({range: t, disableAutoFetch: true, disableStream: true, rangeChunkSize: 1 << 20, isEvalSupported: false}).promise;
  return pdfPages(doc);
}
// 1) tenta leitura parcial (rápida); 2) se falhar, baixa o arquivo inteiro.
// bg = true: uso em segundo plano (capas): não mexe na tela e baixa um arquivo inteiro por vez.
async function makeBook(f, bg) {
  const isPdf = ext(f.name) === 'pdf';
  try {
    let b;
    if (isPdf) b = await pdfBook(f);
    else {
      const head = await rng(f.id, 0, 3);
      if (head[0] === 0x50 && head[1] === 0x4B) b = await zipBook(new DR(f.id, +f.size)); // zip, mesmo se chamado .cbr
    }
    if (b && b.n) { URL.revokeObjectURL(await b.get(0)); return b; } // testa a 1ª página
  } catch (e) { console.warn('Leitura parcial falhou, baixando inteiro:', e); }
  const full = async () => {
    if (!bg) $('#ld').textContent = 'Baixando o arquivo inteiro…';
    const data = await whole(f, bg);
    if (isPdf) return pdfPages(await pdfjsLib.getDocument({data, isEvalSupported: false}).promise);
    if (data[0] === 0x50 && data[1] === 0x4B) return zipBook(new zip.Uint8ArrayReader(data));
    if (!bg) $('#ld').textContent = 'Abrindo CBR…';
    return rarBook(data);
  };
  return bg ? heavy(full) : full();
}

/* ---------- Leitor ---------- */
let bk = null, cur = null, idx = 0, span = 1, cache = new Map(), rtl = ls.get('rtl') === '1', dbl = ls.get('dbl') === '1', token = 0;
const im = $('#im'), im2 = $('#im2');
const imgErr = e => { if (e.target.getAttribute('src')) $('#ld').textContent = 'A imagem desta página não pôde ser exibida.'; };
im.onerror = im2.onerror = imgErr;
const paintDir = () => { $('#dir').textContent = rtl ? 'Dir → Esq' : 'Esq → Dir'; $('#pg').classList.toggle('rtl', rtl); };
const paintDbl = () => { $('#dbl').textContent = 'Página dupla: ' + (dbl ? 'ligada' : 'desligada'); };
paintDir(); paintDbl();

async function openBook(f) {
  cur = f; const my = ++token;
  $('#rd').classList.add('on'); $('#tt').textContent = f.name; $('#ct').textContent = '';
  im.removeAttribute('src'); im2.removeAttribute('src'); $('#pg').classList.remove('two');
  $('#ld').textContent = 'Abrindo…'; bk = null;
  cache.forEach(p => p.then(URL.revokeObjectURL).catch(() => {})); cache.clear();
  try {
    const b = await makeBook(f); if (my !== token) return;
    if (!b.n) throw new Error('nenhuma página encontrada');
    bk = b; const p = jget('p:' + f.id, null);
    show(p && p.i < b.n ? p.i : 0);
  } catch (e) { console.error(e); if (my === token) $('#ld').textContent = 'Erro ao abrir: ' + e.message; }
}
function page(i) {
  if (!cache.has(i)) cache.set(i, bk.get(i));
  return cache.get(i);
}
async function dims(u) { const t = new Image(); t.src = u; await t.decode(); return {w: t.naturalWidth, h: t.naturalHeight}; }
// em página dupla a capa fica sozinha; depois vêm os pares 2-3, 4-5…
const snap = i => (!dbl || i <= 0) ? Math.max(i, 0) : (i % 2 ? i : i - 1);
async function show(i, exact) {
  if (!bk) return;
  const b = bk, my = token;
  i = Math.min(Math.max(i, 0), b.n - 1); if (!exact) i = snap(i);
  idx = i;
  const want2 = dbl && i > 0 && i + 1 < b.n;
  $('#ct').textContent = `${i + 1} / ${b.n}`; $('#ld').textContent = 'Carregando página…';
  try {
    const [u1, u2] = await Promise.all([page(i), want2 ? page(i + 1) : null]);
    if (my !== token || i !== idx) return;
    let two = false;
    if (want2) {
      const [a, c] = await Promise.all([dims(u1), dims(u2)]);
      if (my !== token || i !== idx) return;
      two = a.w <= a.h && c.w <= c.h; // página larga (paisagem) fica sozinha
    }
    span = two ? 2 : 1;
    $('#pg').classList.toggle('two', two);
    im.src = u1; if (two) im2.src = u2; else im2.removeAttribute('src');
    $('#ct').textContent = two ? `${i + 1}–${i + 2} / ${b.n}` : `${i + 1} / ${b.n}`;
    $('#ld').textContent = ''; $('#pg').scrollTop = 0;
    ls.set('p:' + cur.id, JSON.stringify({i: i + span - 1, n: b.n}));
    if (i === 0) idb.get('c:' + cur.id).then(v => v || thumb(u1).then(d => idb.set('c:' + cur.id, d))).catch(() => {});
    for (let k = i + span; k < i + span + 4; k++) if (k < b.n) page(k).catch(() => cache.delete(k));
    for (const [k, p] of cache) if (Math.abs(k - i) > 6) { cache.delete(k); p.then(URL.revokeObjectURL).catch(() => {}); }
  } catch (e) { console.error(e); cache.delete(i); cache.delete(i + 1); if (my === token) $('#ld').textContent = 'Erro na página: ' + e.message; }
}
function go(d) {
  if (!bk) return;
  if (d > 0) { if (idx + span < bk.n) show(idx + span, true); }
  else if (idx > 0) show(idx - 1);
}
const closeRd = () => {
  token++; $('#rd').classList.remove('on'); bk = null; im.removeAttribute('src'); im2.removeAttribute('src');
  cache.forEach(p => p.then(URL.revokeObjectURL).catch(() => {})); cache.clear();
  if (document.fullscreenElement) document.exitFullscreen();
  draw(); pump();
};
$('#x').onclick = closeRd;
$('#zl').onclick = () => go(rtl ? 1 : -1);
$('#zr').onclick = () => go(rtl ? -1 : 1);
$('#fit').onclick = e => { const w = $('#pg').classList.toggle('w'); e.target.textContent = 'Ajuste: ' + (w ? 'largura' : 'altura'); };
$('#dir').onclick = () => { rtl = !rtl; ls.set('rtl', rtl ? '1' : '0'); paintDir(); };
$('#dbl').onclick = () => { dbl = !dbl; ls.set('dbl', dbl ? '1' : '0'); paintDbl(); if (bk) show(idx); };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#rd').requestFullscreen?.();
document.addEventListener('keydown', e => {
  if (!$('#rd').classList.contains('on')) return;
  if (e.key === 'ArrowRight') go(rtl ? -1 : 1);
  else if (e.key === 'ArrowLeft') go(rtl ? 1 : -1);
  else if (e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'Escape') closeRd();
  else if (e.key === 'f') $('#fs').click();
  else if (e.key === 'd') $('#dbl').click();
});
let sx = 0;
$('#pg').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
$('#pg').addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 60) go((d < 0) !== rtl ? 1 : -1);
}, {passive: true});
</script>
