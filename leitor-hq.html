<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prateleira de HQs</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e2238;--card:#2a3050;--ink:#0d0e16;--txt:#eceaf4;--mut:#9a9cb8;--acc:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--bg);border-bottom:3px solid var(--ink);background-image:radial-gradient(rgba(255,210,63,.12) 1.2px,transparent 1.4px);background-size:9px 9px}
h1{font:400 32px Bangers,Impact,sans-serif;letter-spacing:1.5px;margin:0 auto 0 0;color:var(--acc);text-shadow:2px 2px 0 var(--ink)}
input,button{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:8px 12px}
input{min-width:200px}
button{cursor:pointer;font-weight:600}
button:hover,button:focus-visible{background:var(--acc);color:var(--ink);outline:none}
#msg{padding:14px 20px;color:var(--mut);min-height:48px}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;padding:8px 20px 40px}
.card{cursor:pointer;display:block;background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:400}
.card:hover,.card:focus-visible{background:none;color:inherit}
.cov{position:relative;aspect-ratio:2/3;background:var(--card);border:3px solid var(--ink);border-radius:3px;overflow:hidden;transition:transform .15s,box-shadow .15s;display:grid;place-items:center}
.card:hover .cov,.card:focus-visible .cov{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--acc)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font:400 34px Bangers,Impact,sans-serif;color:var(--mut);letter-spacing:2px}
.bar{position:absolute;left:0;bottom:0;height:5px;background:var(--acc)}
.nm{margin-top:8px;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sz{color:var(--mut);font-size:12px}
#rd{position:fixed;inset:0;background:var(--ink);display:none;z-index:10;flex-direction:column}
#rd.on{display:flex}
#top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:2px solid #000;transition:margin .2s}
#top.hide{margin-top:-60px}
#tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pg{position:relative;flex:1;overflow:auto;display:grid;place-items:center}
#pg img{display:block;max-width:100%;max-height:100%;margin:auto;user-select:none}
#pg.w img{max-height:none;width:100%;max-width:none}
#pg.w{place-items:start center}
.z{position:absolute;top:0;bottom:0;width:33%;z-index:2}
#zl{left:0}#zr{right:0}
#ld{position:absolute;inset:auto 0 12px;text-align:center;color:var(--acc);pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Prateleira de HQs</h1>
  <input id="q" type="search" placeholder="Buscar quadrinho" aria-label="Buscar quadrinho">
  <button id="reload" hidden>Atualizar lista</button>
  <button id="login">Entrar com Google</button>
</header>
<div id="msg">Entre com sua conta Google para ver os quadrinhos do seu Drive.</div>
<main id="shelf"></main>

<div id="rd" role="dialog" aria-label="Leitor">
  <div id="top">
    <button id="x">Fechar</button><span id="tt"></span><span id="ct"></span>
    <button id="fit" title="Alternar ajuste">Ajuste: altura</button>
    <button id="dir" title="Sentido de leitura">Esq → Dir</button>
    <button id="fs">Tela cheia</button>
  </div>
  <div id="pg"><div class="z" id="zl"></div><div class="z" id="zr"></div><img id="im" alt=""><div id="ld"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.34/dist/zip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const CLIENT_ID = 'COLE_SEU_CLIENT_ID.apps.googleusercontent.com';
const FOLDER_ID = ''; // opcional: ID de uma pasta do Drive. Vazio = procura no Drive inteiro.
/* ======================== */

const $ = s => document.querySelector(s);
const API = 'https://www.googleapis.com/drive/v3/';
const IMG = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const ext = n => (n.split('.').pop() || '').toLowerCase();
const mime = n => 'image/' + ({jpg: 'jpeg'}[ext(n)] || ext(n));
const mb = n => (n / 1048576).toFixed(n > 1e8 ? 0 : 1) + ' MB';
const ls = {get: k => { try { return localStorage.getItem(k) } catch { return null } },
            set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }};
let files = [], tok = null, exp = 0, tc;
zip.configure({useWebWorkers: false});
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- Login ---------- */
function auth() {
  return new Promise((ok, no) => {
    if (tok && Date.now() < exp - 60000) return ok(tok);
    tc.callback = r => {
      if (r.error) return no(new Error(r.error));
      tok = r.access_token; exp = Date.now() + r.expires_in * 1000; ok(tok);
    };
    tc.requestAccessToken({prompt: ''});
  });
}
window.addEventListener('load', () => {
  const t = setInterval(() => {
    if (!window.google?.accounts) return;
    clearInterval(t);
    tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly', callback: () => {}});
  }, 100);
});
$('#login').onclick = async () => {
  if (!tc) return msg('Biblioteca do Google ainda carregando. Tente de novo.');
  try { await auth(); $('#login').hidden = true; $('#reload').hidden = false; load(); }
  catch (e) { msg('Não foi possível entrar: ' + e.message + '. Confira o Client ID e as origens autorizadas.'); }
};
$('#reload').onclick = () => load();
const msg = t => $('#msg').textContent = t;

/* ---------- Drive ---------- */
async function api(path) {
  const r = await fetch(API + path, {headers: {Authorization: 'Bearer ' + await auth()}});
  if (!r.ok) throw new Error('Drive respondeu ' + r.status);
  return r.json();
}
async function listAll(q) {
  let out = [], pt = '';
  do {
    const r = await api(`files?pageSize=1000&fields=nextPageToken,files(id,name,size,mimeType,thumbnailLink)&q=${encodeURIComponent(q)}${pt ? '&pageToken=' + pt : ''}`);
    out.push(...r.files); pt = r.nextPageToken;
  } while (pt);
  return out;
}
async function crawl(id) {
  const items = await listAll(`'${id}' in parents and trashed=false`);
  const subs = items.filter(i => i.mimeType === 'application/vnd.google-apps.folder');
  const rest = await Promise.all(subs.map(s => crawl(s.id)));
  return items.filter(i => !subs.includes(i)).concat(...rest);
}
async function rng(id, a, b) {
  const r = await fetch(`${API}files/${id}?alt=media`, {headers: {Authorization: 'Bearer ' + await auth(), Range: `bytes=${a}-${b}`}});
  if (!r.ok) throw new Error('Download falhou (' + r.status + ')');
  return new Uint8Array(await r.arrayBuffer());
}
async function whole(f) {
  const r = await fetch(`${API}files/${f.id}?alt=media`, {headers: {Authorization: 'Bearer ' + await auth()}});
  if (!r.ok) throw new Error('Download falhou (' + r.status + ')');
  const rd = r.body.getReader(), buf = new Uint8Array(+f.size); let n = 0;
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    buf.set(value, n); n += value.length; $('#ld').textContent = `Baixando ${mb(n)} de ${mb(+f.size)}…`;
  }
  return buf;
}
async function load() {
  msg('Procurando quadrinhos…'); $('#shelf').innerHTML = '';
  try {
    const all = FOLDER_ID ? await crawl(FOLDER_ID)
      : await listAll("trashed=false and (mimeType='application/pdf' or name contains 'cbz' or name contains 'cbr')");
    files = all.filter(f => /^(cbz|cbr|pdf)$/.test(ext(f.name))).sort((a, b) => nat(a.name, b.name));
    msg(files.length ? '' : 'Nenhum CBZ, CBR ou PDF encontrado.');
    draw();
  } catch (e) { msg('Erro ao listar: ' + e.message); }
}

/* ---------- Prateleira ---------- */
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { obs.unobserve(e.target); queue(e.target); }
}), {rootMargin: '300px'});
function draw() {
  const q = $('#q').value.toLowerCase(), sh = $('#shelf'); sh.innerHTML = '';
  files.filter(f => f.name.toLowerCase().includes(q)).forEach(f => {
    const c = document.createElement('button'); c.className = 'card'; c.f = f;
    const p = JSON.parse(ls.get('p:' + f.id) || 'null');
    c.innerHTML = `<div class="cov"><span class="ph">${ext(f.name).toUpperCase()}</span>${p ? `<i class="bar" style="width:${Math.round((p.i + 1) / p.n * 100)}%"></i>` : ''}</div>
      <div class="nm"></div><div class="sz">${mb(+f.size)}</div>`;
    c.querySelector('.nm').textContent = f.name.replace(/\.[^.]+$/, '');
    c.onclick = () => openBook(f);
    sh.append(c); obs.observe(c);
  });
}
$('#q').oninput = draw;
function setCover(c, src) {
  const cv = c.querySelector('.cov'), old = cv.querySelector('img'); old?.remove();
  const im = new Image(); im.alt = ''; im.src = src; cv.prepend(im); cv.querySelector('.ph')?.remove();
}
let busy = 0, wait = [];
function queue(c) { wait.push(c); pump(); }
async function pump() {
  while (busy < 2 && wait.length) {
    const c = wait.shift(), f = c.f; busy++;
    (async () => {
      const cached = ls.get('c:' + f.id);
      if (cached) return setCover(c, cached);
      if (f.thumbnailLink) { const im = c.querySelector('.cov'); return setCover(c, f.thumbnailLink.replace(/=s\d+$/, '=s400')); }
      if (ext(f.name) === 'cbz') {
        const b = await zipBook(new DR(f.id, +f.size)); const u = await b.get(0);
        const d = await thumb(u); URL.revokeObjectURL(u); ls.set('c:' + f.id, d); setCover(c, d);
      }
    })().catch(() => {}).finally(() => { busy--; pump(); });
  }
}
async function thumb(url) {
  const im = new Image(); im.src = url; await im.decode();
  const s = 260 / im.width, cv = document.createElement('canvas');
  cv.width = 260; cv.height = Math.round(im.height * s);
  cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', .72);
}

/* ---------- Formatos ---------- */
class DR extends zip.Reader {
  constructor(id, size) { super(); this.id = id; this.size = size; }
  async readUint8Array(o, l) { return rng(this.id, o, Math.min(o + l, this.size) - 1); }
}
async function zipBook(reader) {
  const es = (await new zip.ZipReader(reader).getEntries())
    .filter(e => !e.directory && IMG.test(e.filename) && !/__MACOSX/.test(e.filename))
    .sort((a, b) => nat(a.filename, b.filename));
  return {n: es.length, get: async i => URL.createObjectURL(await es[i].getData(new zip.BlobWriter(mime(es[i].filename))))};
}
async function rarBook(data) {
  const base = 'https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/';
  const {createExtractorFromData} = await import(base + '+esm');
  const wasmBinary = await (await fetch(base + 'esm/js/unrar.wasm')).arrayBuffer();
  const ex = await createExtractorFromData({data, wasmBinary});
  const names = [...ex.getFileList().fileHeaders].filter(h => !h.flags.directory && IMG.test(h.name)).map(h => h.name).sort(nat);
  return {n: names.length, get: async i => {
    const fl = [...ex.extract({files: [names[i]]}).files][0];
    return URL.createObjectURL(new Blob([fl.extraction.data], {type: mime(names[i])}));
  }};
}
async function pdfBook(f) {
  const size = +f.size, init = await rng(f.id, 0, Math.min(size, 65536) - 1);
  const t = new pdfjsLib.PDFDataRangeTransport(size, init);
  t.requestDataRange = (b, e) => rng(f.id, b, Math.min(e, size) - 1).then(d => t.onDataRange(b, d));
  const doc = await pdfjsLib.getDocument({range: t, disableAutoFetch: true, disableStream: true, rangeChunkSize: 1 << 20}).promise;
  return {n: doc.numPages, get: async i => {
    const p = await doc.getPage(i + 1), v0 = p.getViewport({scale: 1});
    const v = p.getViewport({scale: Math.min(3, 1800 / Math.max(v0.width, v0.height))});
    const cv = document.createElement('canvas'); cv.width = v.width; cv.height = v.height;
    await p.render({canvasContext: cv.getContext('2d'), viewport: v}).promise;
    return new Promise(ok => cv.toBlob(b => ok(URL.createObjectURL(b)), 'image/jpeg', .9));
  }};
}
async function makeBook(f) {
  if (ext(f.name) === 'pdf') return pdfBook(f);
  const head = await rng(f.id, 0, 3);
  if (head[0] === 0x50 && head[1] === 0x4B) return zipBook(new DR(f.id, +f.size)); // zip, mesmo se chamado .cbr
  $('#ld').textContent = 'CBR não permite leitura parcial: baixando o arquivo inteiro…';
  const data = await whole(f);
  if (data[0] === 0x50 && data[1] === 0x4B) return zipBook(new zip.Uint8ArrayReader(data));
  return rarBook(data);
}

/* ---------- Leitor ---------- */
let bk = null, cur = null, idx = 0, cache = new Map(), rtl = ls.get('rtl') === '1', token = 0;
const im = $('#im');
$('#dir').textContent = rtl ? 'Dir → Esq' : 'Esq → Dir';
async function openBook(f) {
  cur = f; const my = ++token;
  $('#rd').classList.add('on'); $('#tt').textContent = f.name; $('#ct').textContent = '';
  im.removeAttribute('src'); $('#ld').textContent = 'Abrindo…'; bk = null;
  try {
    const b = await makeBook(f); if (my !== token) return;
    if (!b.n) throw new Error('nenhuma página encontrada');
    bk = b; const p = JSON.parse(ls.get('p:' + f.id) || 'null');
    show(p && p.i < b.n ? p.i : 0);
  } catch (e) { $('#ld').textContent = 'Erro ao abrir: ' + e.message; }
}
function page(i) {
  if (!cache.has(i)) cache.set(i, bk.get(i));
  return cache.get(i);
}
async function show(i) {
  if (!bk || i < 0 || i >= bk.n) return;
  idx = i; const my = token, b = bk;
  $('#ct').textContent = `${i + 1} / ${b.n}`; $('#ld').textContent = 'Carregando página…';
  ls.set('p:' + cur.id, JSON.stringify({i, n: b.n}));
  try {
    const u = await page(i); if (my !== token || i !== idx) return;
    im.src = u; $('#ld').textContent = ''; $('#pg').scrollTop = 0;
    if (i === 0 && !ls.get('c:' + cur.id)) thumb(u).then(d => ls.set('c:' + cur.id, d)).catch(() => {});
    [i + 1, i + 2].forEach(k => { if (k < b.n) page(k).catch(() => cache.delete(k)); });
    for (const [k, p] of cache) if (Math.abs(k - i) > 3) { cache.delete(k); p.then(URL.revokeObjectURL).catch(() => {}); }
  } catch (e) { cache.delete(i); $('#ld').textContent = 'Erro na página: ' + e.message; }
}
const go = d => show(idx + d);
const closeRd = () => {
  token++; $('#rd').classList.remove('on'); bk = null;
  cache.forEach(p => p.then(URL.revokeObjectURL).catch(() => {})); cache.clear();
  if (document.fullscreenElement) document.exitFullscreen();
  draw();
};
$('#x').onclick = closeRd;
$('#zl').onclick = () => go(rtl ? 1 : -1);
$('#zr').onclick = () => go(rtl ? -1 : 1);
$('#fit').onclick = e => { const w = $('#pg').classList.toggle('w'); e.target.textContent = 'Ajuste: ' + (w ? 'largura' : 'altura'); };
$('#dir').onclick = e => { rtl = !rtl; ls.set('rtl', rtl ? '1' : '0'); e.target.textContent = rtl ? 'Dir → Esq' : 'Esq → Dir'; };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#rd').requestFullscreen?.();
document.addEventListener('keydown', e => {
  if (!$('#rd').classList.contains('on')) return;
  if (e.key === 'ArrowRight') go(rtl ? -1 : 1);
  else if (e.key === 'ArrowLeft') go(rtl ? 1 : -1);
  else if (e.key === ' ') { e.preventDefault(); go(1); }
  else if (e.key === 'Escape') closeRd();
  else if (e.key === 'f') $('#fs').click();
});
let sx = 0;
$('#pg').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
$('#pg').addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 60) go((d < 0) !== rtl ? 1 : -1);
}, {passive: true});
</script>
</body>
</html>
